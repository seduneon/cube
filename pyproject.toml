[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eqcube"
version = "0.1.0"
description = "Equivariant value networks and search for permutation puzzles"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eqcube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# numpy/torch stubs leave many overloads "partially unknown"; keep the rest of strict.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
